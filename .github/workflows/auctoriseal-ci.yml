name: auctoriseal-ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          set -euo pipefail
          node -v
          npm -v || true
          npm run build
      - name: Test
        run: |
          set -euo pipefail
          npm run test

permissions:
  contents: read
