name: auctoriseal-ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Protocol gates
        shell: bash
        run: |
          set -euo pipefail
          test -f protocol/protocol.md
          test -f protocol/seal.schema.json
          test -f protocol/authority.schema.json
          test -f protocol/revocation.schema.json
          python - <<'PY'
import json, pathlib, sys
req = ["protocol/seal.schema.json","protocol/authority.schema.json","protocol/revocation.schema.json","protocol/envelope.schema.json","protocol/error.schema.json"]
for p in req:
    fp = pathlib.Path(p)
    if not fp.exists(): raise SystemExit(f"E_MISSING_{p}")
    json.loads(fp.read_text(encoding="utf-8"))
print("OK: schemas parse")
PY

      - name: Install test deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest
