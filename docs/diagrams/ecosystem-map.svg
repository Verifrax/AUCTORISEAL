<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .title { font-family: monospace; font-size: 14px; font-weight: bold; fill: #000000; }
      .text { font-family: monospace; font-size: 12px; fill: #000000; }
      .arrow { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .note { font-family: monospace; font-size: 11px; fill: #000000; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <text x="490" y="30" text-anchor="middle" class="title">
    AUCTORISEAL — ECOSYSTEM MAP
  </text>

  <!-- AUCTORISEAL -->
  <rect x="360" y="70" width="260" height="90" class="box"/>
  <text x="490" y="105" text-anchor="middle" class="title">AUCTORISEAL</text>
  <text x="490" y="130" text-anchor="middle" class="text">Authority + Legitimacy</text>
  <text x="490" y="150" text-anchor="middle" class="text">Seals · Revocation · Ledger</text>

  <!-- SPEEDKIT -->
  <rect x="80" y="220" width="240" height="90" class="box"/>
  <text x="200" y="255" text-anchor="middle" class="title">SPEEDKIT</text>
  <text x="200" y="280" text-anchor="middle" class="text">Registry (Truth Surface)</text>

  <!-- ADJUTORIX -->
  <rect x="660" y="220" width="240" height="90" class="box"/>
  <text x="780" y="255" text-anchor="middle" class="title">ADJUTORIX</text>
  <text x="780" y="280" text-anchor="middle" class="text">Governed Execution (Law)</text>

  <!-- PRODUCTS -->
  <rect x="360" y="360" width="260" height="110" class="box"/>
  <text x="490" y="395" text-anchor="middle" class="title">PRODUCTS</text>
  <text x="490" y="420" text-anchor="middle" class="text">VERIFRAX · VATFIX · MK10-PRO</text>
  <text x="490" y="440" text-anchor="middle" class="text">Domain Value (Evidence)</text>

  <!-- Arrows -->
  <line x1="420" y1="160" x2="260" y2="220" class="arrow"/>
  <line x1="560" y1="160" x2="720" y2="220" class="arrow"/>
  <line x1="490" y1="160" x2="490" y2="360" class="arrow"/>

  <line x1="320" y1="265" x2="360" y2="415" class="arrow"/>
  <line x1="660" y1="265" x2="620" y2="415" class="arrow"/>

  <!-- Note -->
  <text x="490" y="500" text-anchor="middle" class="note">
    Truth is registered (SPEEDKIT). Authority is sealed (AUCTORISEAL). Action is enforced (ADJUTORIX). Value is delivered (PRODUCTS).
  </text>
</svg>
