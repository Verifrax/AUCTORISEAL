<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <style>
      .box {
        fill: #ffffff;
        stroke: #000000;
        stroke-width: 2;
      }
      .title {
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #000000;
      }
      .text {
        font-family: monospace;
        font-size: 12px;
        fill: #000000;
      }
      .arrow {
        stroke: #000000;
        stroke-width: 2;
        fill: none;
        marker-end: url(#arrowhead);
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title">
    AUCTORISEAL — AUTHORITY FLOW
  </text>

  <!-- Boxes -->
  <rect x="50" y="80" width="220" height="80" class="box"/>
  <text x="160" y="110" text-anchor="middle" class="title">ROOT AUTHORITY</text>
  <text x="160" y="135" text-anchor="middle" class="text">Explicit, Recorded</text>

  <rect x="340" y="80" width="220" height="80" class="box"/>
  <text x="450" y="110" text-anchor="middle" class="title">AUTHORITY SEAL</text>
  <text x="450" y="135" text-anchor="middle" class="text">Scope + Constraints</text>

  <rect x="630" y="80" width="220" height="80" class="box"/>
  <text x="740" y="110" text-anchor="middle" class="title">DELEGATED AUTHORITY</text>
  <text x="740" y="135" text-anchor="middle" class="text">Optional, Bounded</text>

  <rect x="340" y="240" width="220" height="80" class="box"/>
  <text x="450" y="270" text-anchor="middle" class="title">REVOCATION / FREEZE</text>
  <text x="450" y="295" text-anchor="middle" class="text">Immediate, Final</text>

  <!-- Arrows -->
  <line x1="270" y1="120" x2="340" y2="120" class="arrow"/>
  <line x1="560" y1="120" x2="630" y2="120" class="arrow"/>
  <line x1="450" y1="160" x2="450" y2="240" class="arrow"/>

  <!-- Footer -->
  <text x="450" y="380" text-anchor="middle" class="text">
    Authority must be explicit, prior, bounded, and recorded.
  </text>
</svg>
