<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .title { font-family: monospace; font-size: 14px; font-weight: bold; fill: #000000; }
      .text { font-family: monospace; font-size: 12px; fill: #000000; }
      .arrow { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .note { font-family: monospace; font-size: 11px; fill: #000000; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <text x="490" y="30" text-anchor="middle" class="title">
    AUCTORISEAL — SEAL LIFECYCLE
  </text>

  <!-- Boxes -->
  <rect x="40" y="110" width="170" height="70" class="box"/>
  <text x="125" y="138" text-anchor="middle" class="title">ISSUE</text>
  <text x="125" y="160" text-anchor="middle" class="text">operator action</text>

  <rect x="245" y="110" width="170" height="70" class="box"/>
  <text x="330" y="138" text-anchor="middle" class="title">RECORD</text>
  <text x="330" y="160" text-anchor="middle" class="text">append-only</text>

  <rect x="450" y="110" width="170" height="70" class="box"/>
  <text x="535" y="138" text-anchor="middle" class="title">VALIDATE</text>
  <text x="535" y="160" text-anchor="middle" class="text">deterministic</text>

  <rect x="655" y="110" width="170" height="70" class="box"/>
  <text x="740" y="138" text-anchor="middle" class="title">CONSUME</text>
  <text x="740" y="160" text-anchor="middle" class="text">defer-to-seal</text>

  <rect x="860" y="110" width="80" height="70" class="box"/>
  <text x="900" y="145" text-anchor="middle" class="title">ACT</text>

  <!-- Revocation path -->
  <rect x="390" y="260" width="200" height="80" class="box"/>
  <text x="490" y="290" text-anchor="middle" class="title">REVOKE / FREEZE</text>
  <text x="490" y="314" text-anchor="middle" class="text">immediate override</text>

  <!-- Arrows main -->
  <line x1="210" y1="145" x2="245" y2="145" class="arrow"/>
  <line x1="415" y1="145" x2="450" y2="145" class="arrow"/>
  <line x1="620" y1="145" x2="655" y2="145" class="arrow"/>
  <line x1="825" y1="145" x2="860" y2="145" class="arrow"/>

  <!-- Arrows to revoke -->
  <line x1="535" y1="180" x2="535" y2="260" class="arrow"/>
  <line x1="740" y1="180" x2="590" y2="260" class="arrow"/>

  <!-- Note -->
  <text x="490" y="385" text-anchor="middle" class="note">
    Revocation and freeze override prior grants. If authority is unclear, validation fails closed.
  </text>
</svg>
